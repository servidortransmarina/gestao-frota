<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gestão de Frota</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--dim:#94a3b8;--primary:#3b82f6;--success:#22c55e;--warning:#eab308;--danger:#ef4444;}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);}
header{background:#1e3a8a;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;}
header h1{font-size:18px;margin:0;}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;}
nav button{background:none;border:none;color:var(--dim);padding:14px 20px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;font-weight:bold;}
nav button.active{color:var(--primary);border-bottom-color:var(--primary);}
main{padding:24px;max-width:1300px;margin:0 auto;}
.tab{display:none;}
.tab.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:18px;}
.card h2{margin-top:0;font-size:16px;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;}
.field{display:flex;flex-direction:column;gap:5px;min-width:150px;}
.field label{font-size:12px;color:var(--dim);font-weight:bold;}
input,select{background:#0f172a;border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:5px;font-size:14px;width:100%;}
input.err,select.err{border-color:var(--danger);}
small.errmsg{color:var(--danger);font-size:11px;}
.info-box{background:rgba(59,130,246,.1);border:1px solid var(--primary);border-radius:6px;padding:10px 12px;font-size:13px;color:#93c5fd;margin-bottom:12px;}
button.btn{background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:5px;cursor:pointer;font-size:14px;font-weight:bold;}
button.btn:hover{opacity:.9;}
button.btn:disabled{opacity:.5;cursor:not-allowed;}
button.btn.secondary{background:#334155;}
button.btn.danger{background:var(--danger);}
button.btn.success{background:var(--success);}
button.btn.warn{background:var(--warning);color:#111;}
button.btn.small{padding:5px 10px;font-size:12px;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
th{color:var(--dim);font-size:11px;text-transform:uppercase;}
.empty{color:var(--dim);padding:24px;text-align:center;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:bold;}
.badge.red{background:rgba(239,68,68,.15);color:#f87171;}
.badge.yellow{background:rgba(234,179,8,.15);color:#facc15;}
.badge.green{background:rgba(34,197,94,.15);color:#4ade80;}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
.kpi .label{color:var(--dim);font-size:11px;text-transform:uppercase;margin-bottom:6px;}
.kpi .value{font-size:22px;font-weight:bold;}
.chip{background:#1e293b;border:1px solid var(--border);padding:9px 14px;border-radius:6px;cursor:pointer;font-weight:bold;display:inline-flex;align-items:center;gap:8px;margin:4px 6px 4px 0;}
.chip:hover{border-color:var(--primary);}
.chip .dot{width:8px;height:8px;border-radius:50%;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:999;}
.overlay.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:22px;width:100%;max-width:440px;max-height:88vh;overflow:auto;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.back{cursor:pointer;color:var(--primary);font-size:13px;font-weight:bold;margin-bottom:12px;display:inline-block;}
.limitbox{background:#0f172a;border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px;}
.alertcard{background:var(--card);border-left:5px solid var(--danger);border-radius:6px;padding:14px 18px;margin-bottom:12px;}
.alertcard.analise{border-left-color:var(--warning);}
.alertcard.resolvido{border-left-color:var(--success);}
.alertmsg{font-weight:bold;color:#f87171;margin:8px 0;}
.toast{position:fixed;bottom:18px;right:18px;background:var(--card);border-left:4px solid var(--success);padding:12px 18px;border-radius:6px;display:none;z-index:2000;max-width:400px;}
.toast.show{display:block;}
.toast.err{border-left-color:var(--danger);}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.bar-label{min-width:90px;font-size:13px;font-weight:bold;}
.bar-track{flex:1;background:#0f172a;border-radius:5px;height:20px;overflow:hidden;}
.bar-fill{background:var(--primary);height:100%;color:#fff;font-size:11px;padding-left:6px;line-height:20px;font-weight:bold;white-space:nowrap;}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.85);align-items:center;justify-content:center;z-index:3000;font-size:16px;color:var(--text);}
.loading-overlay.show{display:flex;}
</style>
</head>
<body>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbylesg0ZL8qLXqQ7igUSJ3dF-t59QLeh7aJoawxgndTfDDsuP5bs_F9sjJ9P_4lyVVj/exec";
</script>

<header>
  <h1>🚚 Gestão de Frota</h1>
  <div style="display:flex;align-items:center;gap:14px;">
    <button class="btn secondary small" onclick="atualizarManualmente()" id="btnAtualizar">🔄 Atualizar dados</button>
    <div id="dateNow" style="font-size:12px;color:var(--dim);"></div>
  </div>
</header>

<nav>
  <button class="navbtn active" data-tab="cadastro">Cadastro de Veículos</button>
  <button class="navbtn" data-tab="manutencao">Manutenção</button>
  <button class="navbtn" data-tab="dashboard">Dashboard</button>
  <button class="navbtn" data-tab="alertas">Alertas <span id="alertBadge"></span></button>
  <button class="navbtn" data-tab="resolvidos">Resolvidos</button>
</nav>

<main>

<section id="tab-cadastro" class="tab active">
  <div class="card">
    <h2>Cadastrar novo veículo</h2>
    <div class="row">
      <div class="field" style="flex:1;">
        <label>Placa do veículo</label>
        <input id="inputPlaca" placeholder="Ex: ABC1234 ou ABC1D23" maxlength="8">
        <small class="errmsg" id="errPlaca"></small>
      </div>
      <button class="btn" id="btnCadastrarVeiculo" onclick="cadastrarVeiculo()">Cadastrar</button>
    </div>
  </div>
  <div class="card">
    <h2>Veículos cadastrados</h2>
    <div id="listaCadastro"></div>
  </div>
</section>

<section id="tab-manutencao" class="tab">
  <div id="manutListaWrap">
    <div class="card">
      <h2>Selecione um veículo</h2>
      <div id="chipsVeiculos"></div>
    </div>
  </div>
  <div id="manutDetalheWrap" style="display:none;"></div>
</section>

<section id="tab-dashboard" class="tab">
  <div class="card">
    <div class="row">
      <div class="field">
        <label>Veículo</label>
        <select id="dashVeiculo" onchange="renderDashboard()"><option value="todos">Todos os veículos</option></select>
      </div>
      <div class="field">
        <label>Período</label>
        <select id="dashPeriodo" onchange="renderDashboard()">
          <option value="todos">Todo o período</option>
          <option value="mes">Este mês</option>
          <option value="3m">Últimos 3 meses</option>
          <option value="6m">Últimos 6 meses</option>
          <option value="12m">Últimos 12 meses</option>
        </select>
      </div>
    </div>
  </div>
  <div class="grid-cards" id="dashKpis"></div>
  <div class="card">
    <h2>Gasto total por veículo</h2>
    <div id="dashChart"></div>
  </div>
</section>

<section id="tab-alertas" class="tab">
  <div class="card">
    <h2>Alertas ativos de manutenção</h2>
    <div id="alertasLista"></div>
  </div>
</section>

<section id="tab-resolvidos" class="tab">
  <div class="card">
    <h2>Histórico de alertas resolvidos</h2>
    <div id="resolvidosLista"></div>
  </div>
</section>

</main>

<div class="overlay" id="modalConfirm">
  <div class="modal">
    <h3 id="confirmTitle">Confirmar</h3>
    <p id="confirmMsg" style="color:var(--dim);"></p>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('modalConfirm')">Cancelar</button>
      <button class="btn danger" id="confirmBtn">Confirmar</button>
    </div>
  </div>
</div>

<div class="overlay" id="modalManut">
  <div class="modal">
    <h3 id="manutTitle">Adicionar manutenção</h3>
    <div class="info-box" id="ultimaInfoBox" style="display:none;"></div>
    <div class="field" style="margin-bottom:10px;">
      <label>Tipo de manutenção *</label>
      <select id="mTipo" onchange="toggleOutro(); mostrarUltimaInfo();">
        <option value="">Selecione...</option>
        <option value="oleo">Troca de óleo</option>
        <option value="alinhamento">Alinhamento</option>
        <option value="oleo_caixa">Troca de óleo da caixa</option>
        <option value="oleo_diferencial">Troca de óleo do diferencial</option>
        <option value="outro">Outro</option>
      </select>
      <small class="errmsg" id="errTipo"></small>
    </div>
    <div class="field" id="wrapOutro" style="display:none;margin-bottom:10px;">
      <label>Qual foi a manutenção realizada? *</label>
      <input id="mDescricao" placeholder="Ex: Troca de correia dentada">
      <small class="errmsg" id="errDescricao"></small>
    </div>
    <div class="field" style="margin-bottom:10px;">
      <label>Quilometragem no momento *</label>
      <input id="mKm" type="text" inputmode="numeric" placeholder="Ex: 125.000">
      <small class="errmsg" id="errKm"></small>
    </div>
    <div class="field" style="margin-bottom:10px;">
      <label>Data da manutenção *</label>
      <input id="mData" type="date">
      <small class="errmsg" id="errData"></small>
    </div>
    <div class="field" style="margin-bottom:10px;">
      <label>Valor gasto (R$) — opcional</label>
      <input id="mValor" type="text" inputmode="decimal" placeholder="Ex: 1.250,00 (deixe em branco se não houve custo)">
      <small class="errmsg" id="errValor"></small>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('modalManut')">Cancelar</button>
      <button class="btn" id="btnSalvarManut" onclick="salvarManutencao()">Salvar</button>
    </div>
  </div>
</div>

<div class="overlay" id="modalKm">
  <div class="modal">
    <h3>Atualizar quilometragem atual</h3>
    <div class="field">
      <label>Quilometragem atual (km) *</label>
      <input id="kmAtualInput" type="text" inputmode="numeric" placeholder="Ex: 440.000">
      <small class="errmsg" id="errKmAtual"></small>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('modalKm')">Cancelar</button>
      <button class="btn" id="btnSalvarKm" onclick="salvarKmAtual()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loadingOverlay">Carregando dados da planilha...</div>

<script>
/* ================= ESTADO ================= */
let db = { veiculos:[], manutencoes:[], limites:{}, alertas:[] };
let carregando = false;

const TIPOS = {
  oleo:'Troca de óleo',
  alinhamento:'Alinhamento',
  oleo_caixa:'Troca de óleo da caixa',
  oleo_diferencial:'Troca de óleo do diferencial'
};
const TIPOS_RASTREADOS = ['oleo','alinhamento','oleo_caixa','oleo_diferencial'];
const LIMITES_PADRAO = {
  oleo:{modo:'km_e_meses', km:15000, meses:12},
  alinhamento:{modo:'km_e_meses', km:20000, meses:6},
  oleo_caixa:{modo:'km_e_meses', km:100000, meses:24},
  oleo_diferencial:{modo:'km_e_meses', km:100000, meses:24}
};
const LABEL_ULTIMA = {
  oleo:'Última troca de óleo',
  alinhamento:'Último alinhamento',
  oleo_caixa:'Último óleo da caixa',
  oleo_diferencial:'Último óleo do diferencial'
};

/* ================= CACHE LOCAL ================= */
const CACHE_KEY = 'frotaCacheV1';

function salvarCache(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(db)); }catch(e){}
}

function carregarCache(){
  try{
    const c = localStorage.getItem(CACHE_KEY);
    if(!c) return false;
    const dados = JSON.parse(c);
    if(!dados || !Array.isArray(dados.veiculos)) return false;
    db = dados;
    db.veiculos.forEach(v=>garantirLimites(v.placa));
    return true;
  }catch(e){ return false; }
}

/* ================= FILA DE REQUISIÇÕES ================= */
let _fila = Promise.resolve();
function enfileirar(fn){
  const p = _fila.then(fn);
  _fila = p.catch(()=>{});
  return p;
}

/* ================= COMUNICAÇÃO COM A PLANILHA ================= */
function setLoading(v){
  carregando = v;
  document.getElementById('loadingOverlay').classList.toggle('show', v);
}

async function fetchGetComRetry(url, tentativas){
  let ultimoErro;
  for(let i=0; i<(tentativas||3); i++){
    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      return res;
    }catch(e){
      ultimoErro = e;
      await new Promise(r=>setTimeout(r, 1000*(i+1)));
    }
  }
  throw ultimoErro;
}

async function apiGet(){
  return enfileirar(async ()=>{
    const res = await fetchGetComRetry(API_URL + '?action=getAll', 3);
    return res.json();
  });
}

async function apiPost(action, data){
  return enfileirar(async ()=>{
    const res = await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify({ action, data })
    });
    if(!res.ok) throw new Error('Falha ao enviar dados para a planilha.');
    const json = await res.json();
    if(json.error) throw new Error(json.error);
    return json;
  });
}

function normalizarDadosDaPlanilha(raw){
  const veiculos = (raw.veiculos||[]).map(v=>({
    placa: String(v.placa).trim().toUpperCase(),
    kmAtual: Number(v.kmAtual)||0
  }));

  const manutencoes = (raw.manutencoes||[]).map(m=>({
    id: String(m.id),
    placa: String(m.placa).trim().toUpperCase(),
    tipo: String(m.tipo||'').trim(),
    descricao: m.descricao || m['descrição'] || '',
    km: Number(m.km)||0,
    data: formatarDataPlanilhaParaISO(m.data),
    valor: Number(m.valor)||0
  }));

  const limites = {};
  (raw.limites||[]).forEach(l=>{
    const placa = String(l.placa).trim().toUpperCase();
    if(!limites[placa]) limites[placa] = {};
    limites[placa][String(l.tipo||'').trim()] = { modo: l.modo, km: Number(l.km)||0, meses: Number(l.meses)||0 };
  });

  const alertas = (raw.alertas||[]).map(a=>({
    id: String(a.id),
    placa: String(a.placa).trim().toUpperCase(),
    tipo: String(a.tipo||'').trim(),
    status: a.status || 'ativo',
    dataAnalise: a.dataAnalise ? formatarDataPlanilhaParaISO(a.dataAnalise) : null,
    dataResolucao: a.dataResolucao ? formatarDataPlanilhaParaISO(a.dataResolucao) : null
  }));

  return { veiculos, manutencoes, limites, alertas };
}

function formatarDataPlanilhaParaISO(valor){
  if(!valor) return '';
  if(typeof valor === 'string' && /^\d{4}-\d{2}-\d{2}/.test(valor)) return valor.slice(0,10);
  const d = new Date(valor);
  if(isNaN(d.getTime())) return '';
  const ano = d.getFullYear();
  const mes = String(d.getMonth()+1).padStart(2,'0');
  const dia = String(d.getDate()).padStart(2,'0');
  return `${ano}-${mes}-${dia}`;
}

async function carregarDoServidor(silencioso){
  if(!silencioso) setLoading(true);
  try{
    const raw = await apiGet();
    db = normalizarDadosDaPlanilha(raw);
    db.veiculos.forEach(v=> garantirLimites(v.placa));
    salvarCache();
  }catch(e){
    if(silencioso) console.error('Erro ao atualizar em segundo plano:', e);
    else toast('Erro ao carregar dados da planilha: ' + e.message, true);
  }finally{
    if(!silencioso) setLoading(false);
  }
}

function garantirLimites(placa){
  if(!db.limites[placa]) db.limites[placa] = {};
  TIPOS_RASTREADOS.forEach(t=>{
    if(!db.limites[placa][t]) db.limites[placa][t] = Object.assign({}, LIMITES_PADRAO[t]);
  });
}

function gerarId(){
  return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,9);
}

/* ================= UTIL ================= */
function fmtData(iso){ if(!iso) return '-'; const [a,m,d]=iso.split('-'); return `${d}/${m}/${a}`; }
function hojeISO(){ return new Date().toISOString().split('T')[0]; }
function fmtMoeda(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtKm(v){ return (v||0).toLocaleString('pt-BR')+' km'; }

function parseNumeroBR(str){
  if(str===null||str===undefined) return NaN;
  let s=String(str).trim();
  if(s==='') return NaN;
  s=s.replace(/\s/g,'').replace(/\./g,'').replace(',','.');
  return Number(s);
}

function toast(msg,isErr){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show'+(isErr?' err':'');
  setTimeout(()=>{t.className='toast';}, isErr?6000:3500);
}
function addMeses(iso,meses){ const d=new Date(iso+'T00:00:00'); d.setMonth(d.getMonth()+meses); return d.toISOString().split('T')[0]; }

function normalizarPlaca(p){ return p.trim().toUpperCase().replace(/[^A-Z0-9]/g,''); }
function placaValida(p){
  const padraoAntigo = /^[A-Z]{3}[0-9]{4}$/;
  const padraoMercosul = /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/;
  return padraoAntigo.test(p) || padraoMercosul.test(p);
}

function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function openModal(id){ document.getElementById(id).classList.add('show'); }

/* ================= NAVEGAÇÃO ================= */
function renderTelaAtual(){
  const tabAtiva=document.querySelector('.navbtn.active').dataset.tab;
  if(tabAtiva==='manutencao'){ if(veiculoSel) renderDetalhe(); else renderManutTab(); }
  if(tabAtiva==='dashboard') renderDashboard();
  if(tabAtiva==='alertas') renderAlertas();
  if(tabAtiva==='resolvidos') renderResolvidos();
  if(tabAtiva==='cadastro') renderCadastro();
}

document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');

    if(btn.dataset.tab==='manutencao') renderManutTab();
    if(btn.dataset.tab==='dashboard') renderDashboard();
    if(btn.dataset.tab==='alertas') renderAlertas();
    if(btn.dataset.tab==='resolvidos') renderResolvidos();
    if(btn.dataset.tab==='cadastro') renderCadastro();
  });
});

async function atualizarManualmente(){
  const btn=document.getElementById('btnAtualizar');
  btn.disabled=true;
  await carregarDoServidor();
  await sincronizarAlertas();
  renderTelaAtual();
  toast('Dados atualizados.');
  btn.disabled=false;
}

/* ================= ABA 1: CADASTRO ================= */
async function cadastrarVeiculo(){
  const input=document.getElementById('inputPlaca');
  const err=document.getElementById('errPlaca');
  const btn=document.getElementById('btnCadastrarVeiculo');
  err.textContent=''; input.classList.remove('err');
  const placa=normalizarPlaca(input.value);
  if(!placa){ err.textContent='Informe a placa do veículo.'; input.classList.add('err'); return; }
  if(!placaValida(placa)){
    err.textContent='Placa inválida. Use o formato antigo (ABC1234) ou Mercosul (ABC1D23).';
    input.classList.add('err');
    return;
  }
  if(db.veiculos.some(v=>v.placa===placa)){ err.textContent='Já existe um veículo cadastrado com esta placa.'; input.classList.add('err'); return; }

  btn.disabled=true;
  try{
    await apiPost('addVeiculo', { placa });
    db.veiculos.push({ placa, kmAtual: 0 });
    garantirLimites(placa);
    salvarCache();
    input.value='';
    toast('Veículo '+placa+' cadastrado com sucesso.');
    renderCadastro();
    sincronizarAlertas();
  }catch(e){
    toast('Erro ao cadastrar: '+e.message, true);
  }finally{
    btn.disabled=false;
  }
}

function excluirVeiculo(placa){
  document.getElementById('confirmTitle').textContent='Excluir veículo';
  document.getElementById('confirmMsg').textContent='Tem certeza de que deseja excluir o veículo '+placa+'? Todo o histórico de manutenções também será removido.';
  document.getElementById('confirmBtn').onclick=async ()=>{
    try{
      await apiPost('deleteVeiculo', { placa });
      await carregarDoServidor();
      closeModal('modalConfirm');
      toast('Veículo '+placa+' excluído.');
      renderCadastro();
    }catch(e){
      toast('Erro ao excluir: '+e.message, true);
    }
  };
  openModal('modalConfirm');
}

function renderCadastro(){
  const el=document.getElementById('listaCadastro');
  if(db.veiculos.length===0){ el.innerHTML='<div class="empty">Nenhum veículo cadastrado ainda.</div>'; return; }
  let html='<table><thead><tr><th>Placa</th><th>Km atual</th><th>Total gasto</th><th>Manutenções</th><th></th></tr></thead><tbody>';
  db.veiculos.forEach(v=>{
    const ms=db.manutencoes.filter(m=>m.placa===v.placa);
    const total=ms.reduce((s,m)=>s+m.valor,0);
    html+=`<tr><td><b>${v.placa}</b></td><td>${fmtKm(v.kmAtual)}</td><td>${fmtMoeda(total)}</td><td>${ms.length}</td><td><button class="btn danger small" onclick="excluirVeiculo('${v.placa}')">Excluir</button></td></tr>`;
  });
  html+='</tbody></table>';
  el.innerHTML=html;
}

let veiculoSel=null;

function statusVeiculo(placa){
  const al=db.alertas.filter(a=>a.placa===placa && a.status!=='resolvido');
  if(al.some(a=>a.status==='ativo')) return 'atrasado';
  if(al.some(a=>a.status==='analise')) return 'analise';
  return 'ok';
}

function renderManutTab(){
  veiculoSel=null;
  document.getElementById('manutDetalheWrap').style.display='none';
  document.getElementById('manutListaWrap').style.display='block';
  const wrap=document.getElementById('chipsVeiculos');
  if(db.veiculos.length===0){ wrap.innerHTML='<div class="empty">Nenhum veículo cadastrado. Vá até "Cadastro de Veículos".</div>'; return; }
  wrap.innerHTML=db.veiculos.map(v=>{
    const st=statusVeiculo(v.placa);
    const cor= st==='atrasado' ? 'var(--danger)' : (st==='analise' ? 'var(--warning)' : 'var(--success)');
    return `<span class="chip" onclick="selecionarVeiculo('${v.placa}')"><span class="dot" style="background:${cor}"></span>${v.placa}</span>`;
  }).join('');
}

async function selecionarVeiculo(placa){
  veiculoSel=placa;
  document.getElementById('manutListaWrap').style.display='none';
  document.getElementById('manutDetalheWrap').style.display='block';
  renderDetalhe();
}

function ultimaManut(placa,tipo){
  const l=db.manutencoes.filter(m=>m.placa===placa && m.tipo===tipo).sort((a,b)=>new Date(b.data)-new Date(a.data));
  return l[0]||null;
}

function calcularLimite(placa,tipo){
  garantirLimites(placa);
  const cfg=db.limites[placa][tipo];
  if(!cfg) return null;
  const ult=ultimaManut(placa,tipo);
  if(!ult) return {temUltima:false, cfg};
  const limiteKm = cfg.modo!=='meses' ? ult.km + Number(cfg.km) : null;
  const limiteData = cfg.modo!=='km' ? addMeses(ult.data, Number(cfg.meses)) : null;
  return { temUltima:true, ultima:ult, limiteKm, limiteData, cfg };
}

function verificarAlerta(placa,tipo){
  const info=calcularLimite(placa,tipo);
  if(!info) return null;
  if(!info.temUltima) return { deveAlertar:true, semHistorico:true, info };
  const veiculo=db.veiculos.find(v=>v.placa===placa);
  const kmAtual=veiculo?veiculo.kmAtual:0;
  const hoje=hojeISO();
  let excedKm=false, excedTempo=false;
  if(info.limiteKm!==null && kmAtual>=info.limiteKm) excedKm=true;
  if(info.limiteData!==null && hoje>=info.limiteData) excedTempo=true;
  let deveAlertar=false;
  if(info.cfg.modo==='km') deveAlertar=excedKm;
  else if(info.cfg.modo==='meses') deveAlertar=excedTempo;
  else deveAlertar = excedKm || excedTempo;
  return { deveAlertar, excedKm, excedTempo, info, kmAtual, hoje };
}
